<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador GPS de Mascotas | En Vivo</title>
  
  <!-- Librería Leaflet para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    header {
      background: linear-gradient(135deg, #1e1b4b, #4338ca);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #6366f1;
    }
    header h1 { font-size: 1.3rem; }
    header p { font-size: 0.8rem; color: #c7d2fe; }

    .badge {
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .contenedor {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    @media (min-width: 800px) {
      .contenedor { flex-direction: row; }
    }

    aside {
      background: #1e293b;
      width: 100%;
      max-width: 340px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .coords {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .coord-box {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
    }
    .coord-box span { font-size: 0.7rem; color: #94a3b8; display: block; }
    .coord-box strong { font-size: 0.95rem; color: #38bdf8; font-family: monospace; }

    #map {
      flex: 1;
      min-height: 450px;
      height: 100%;
      background: #020617;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🐾 Rastreador GPS de Mascotas</h1>
      <p>ESP32 + NEO-6M | Proyecto de Robótica (Paraguay)</p>
    </div>
    <div class="badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Conectando...</span>
    </div>
  </header>

  <div class="contenedor">
    <aside>
      <div class="card">
        <span style="font-size:0.75rem; text-transform:uppercase; color:#94a3b8;">📍 Posición GPS</span>
        <div class="coords">
          <div class="coord-box">
            <span>Latitud</span>
            <strong id="valLat">-25.283045</strong>
          </div>
          <div class="coord-box">
            <span>Longitud</span>
            <strong id="valLng">-57.631999</strong>
          </div>
        </div>
      </div>

      <div class="card" style="font-size:0.85rem; line-height:1.8;">
        <div>Última señal: <strong id="valHora">Iniciando...</strong></div>
        <div>Servidor: <strong style="color:#818cf8;">onrender.com</strong></div>
      </div>

      <button id="btnCentrar">🎯 Centrar Mapa en Mascota</button>
    </aside>

    <div id="map"></div>
  </div>

  <script>
    const API_URL = 'https://rastreador-gps-v4ww.onrender.com/datos';
    
    // Iniciar mapa en Paraguay
    const map = L.map('map').setView([-25.283045, -57.631999], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const iconoMascota = L.divIcon({
      html: '<div style="background:#4f46e5; border:3px solid #fff; border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 10px rgba(0,0,0,0.5);">🐶</div>',
      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });

    let marker = L.marker([-25.283045, -57.631999], { icon: iconoMascota }).addTo(map);
    let polyline = L.polyline([], { color: '#6366f1', weight: 4 }).addTo(map);
    let ruta = [];

    async function actualizarGPS() {
      try {
        const respuesta = await fetch(API_URL);
        const data = await respuesta.json();

        if (data.lat !== null && data.lng !== null && !isNaN(data.lat)) {
          const lat = parseFloat(data.lat);
          const lng = parseFloat(data.lng);

          document.getElementById('statusDot').className = 'dot online';
          document.getElementById('statusText').textContent = 'GPS Conectado';
          document.getElementById('valLat').textContent = lat.toFixed(6);
          document.getElementById('valLng').textContent = lng.toFixed(6);
          document.getElementById('valHora').textContent = new Date().toLocaleTimeString('es-PY');

          const nuevaPos = [lat, lng];
          marker.setLatLng(nuevaPos);
          ruta.push(nuevaPos);
          polyline.setLatLngs(ruta);
        } else {
          document.getElementById('statusDot').className = 'dot';
          document.getElementById('statusText').textContent = 'Esperando al ESP32';
          document.getElementById('valHora').textContent = 'Servidor activo, sin coordenadas';
        }
      } catch (error) {
        document.getElementById('statusDot').className = 'dot';
        document.getElementById('statusText').textContent = 'Conectando con Render...';
      }
    }

    document.getElementById('btnCentrar').onclick = () => {
      map.setView(marker.getLatLng(), 17);
    };

    actualizarGPS();
    setInterval(actualizarGPS, 3000);
  </script>
</body>
</html>
